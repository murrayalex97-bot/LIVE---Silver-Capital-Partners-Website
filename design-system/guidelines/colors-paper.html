<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div><div class="chip" style="background:#E2E0DA;border:1px solid var(--rule-soft)"></div><div class="nm">Paper line</div><div class="meta">#E2E0DA</div><div class="meta">--paper-line</div></div>
