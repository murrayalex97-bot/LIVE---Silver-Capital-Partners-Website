<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body);color:var(--text-heading)}
.sw{display:flex;gap:0}.sw>div{flex:1}.chip{height:64px}
.meta{font-size:10px;letter-spacing:.06em;color:var(--text-muted);margin-top:8px;font-variant-numeric:tabular-nums}
.nm{font-size:11px;font-weight:500;margin-top:6px}
.eyebrow{font-size:var(--eyebrow-size);font-weight:500;letter-spacing:var(--eyebrow-track);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:flex;align-items:center;gap:44px">
<div style="text-align:center"><div style="height:40px;display:flex;align-items:center;justify-content:center"><div style="width:5px;height:5px;background:var(--ink-900);transform:rotate(45deg)"></div></div><div class="meta">5px</div><div class="meta">--diamond-sm</div></div><div style="text-align:center"><div style="height:40px;display:flex;align-items:center;justify-content:center"><div style="width:9px;height:9px;background:var(--ink-900);transform:rotate(45deg)"></div></div><div class="meta">9px</div><div class="meta">--diamond-md</div></div><div style="text-align:center"><div style="height:40px;display:flex;align-items:center;justify-content:center"><div style="width:15px;height:15px;background:var(--ink-900);transform:rotate(45deg)"></div></div><div class="meta">15px</div><div class="meta">--diamond-lg</div></div><div style="text-align:center"><div style="height:40px;display:flex;align-items:center;justify-content:center"><div style="width:30px;height:30px;background:var(--ink-900);transform:rotate(45deg)"></div></div><div class="meta">30px</div><div class="meta">--diamond-xl</div></div>
<div style="text-align:center"><div style="height:40px;display:flex;align-items:center;justify-content:center"><div style="width:36px;height:36px;border:1px solid rgba(76,101,112,0.5);transform:rotate(45deg)"></div></div><div class="meta">outline</div><div class="meta">motif</div></div>
</div></body></html>
